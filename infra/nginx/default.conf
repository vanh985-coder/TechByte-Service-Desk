# Install on Ubuntu as /etc/nginx/sites-available/anhdang2k7.io.vn.
# Enable through sites-enabled after installing the origin certificate and key.
server {
    listen 80;
    server_name anhdang2k7.io.vn;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://anhdang2k7.io.vn$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name anhdang2k7.io.vn;
    server_tokens off;
    ssl_certificate /etc/nginx/ssl/anhdang2k7.io.vn.crt;
    ssl_certificate_key /etc/nginx/ssl/anhdang2k7.io.vn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    client_max_body_size 2m;

    access_log /var/log/nginx/techbyte.access.log;
    error_log /var/log/nginx/techbyte.error.log;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        # No trailing slash: keep /api because Spring controllers include it.
        proxy_pass http://127.0.0.1:8080;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
    }
}
