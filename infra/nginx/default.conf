# Rendered by the official Nginx entrypoint from /etc/nginx/templates/.
# APP_DOMAIN comes from Compose. All other $variables belong to Nginx.
server {
    listen 80;
    server_name ${APP_DOMAIN};
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://${APP_DOMAIN}$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ${APP_DOMAIN};
    server_tokens off;
    ssl_certificate /etc/nginx/tls/origin.crt;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    client_max_body_size 2m;

    # Docker DNS resolves service names again after app containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend_upstream frontend:80;
    set $backend_upstream backend:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        # No trailing slash: keep /api because Spring controllers include it.
        proxy_pass http://$backend_upstream;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://$frontend_upstream;
    }
}
