name: techbyte

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  database:
    image: postgres:16-alpine
    # Matches the existing database team's backup/restore scripts.
    container_name: database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servicedesk}
      POSTGRES_USER: ${POSTGRES_USER:-servicedesk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your env file}
    volumes:
      - db_volume:/var/lib/postgresql/data
    networks:
      - db_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  backend:
    image: ${BACKEND_IMAGE:-techbyte-backend:local}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # Nginx runs directly on Ubuntu and reaches the API over loopback.
    ports:
      - '127.0.0.1:8080:8080'
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      SERVER_PORT: '8080'
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-servicedesk}
      DB_USERNAME: ${POSTGRES_USER:-servicedesk_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your env file}
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-servicedesk}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-servicedesk_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your env file}
      JPA_DDL_AUTO: validate
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: 'true'
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: 'false'
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 32 characters}
      CORS_ALLOWED_ORIGINS: ${APP_URL:-https://localhost}
      # Public deployments do not create the source code's default demo accounts.
      APP_SEED_ENABLED: 'false'
      SEED_DEMO_DATA: 'false'
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app_network
      - db_network
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:8080/ready']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s
    logging: *logging

  frontend:
    image: ${FRONTEND_IMAGE:-techbyte-frontend:local}
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:8081:80'
    networks:
      - app_network
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/healthz']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: *logging

volumes:
  db_volume:
    name: db_volume

networks:
  app_network:
  db_network:
    internal: true
